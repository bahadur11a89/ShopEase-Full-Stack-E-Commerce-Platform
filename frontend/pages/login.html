<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase | Login</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0d6efd 0%, #084298 100%); padding: 40px 20px; }
.auth-card { background: #fff; border-radius: 16px; padding: 45px 40px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.auth-logo { text-align: center; margin-bottom: 30px; }
.auth-logo a { font-size: 32px; font-weight: 800; color: var(--primary); text-decoration: none; }
.auth-logo a span { color: #ffc107; }
.auth-card h2 { font-size: 26px; text-align: center; margin-bottom: 8px; color: #212529; }
.auth-card .subtitle { text-align: center; color: var(--secondary); margin-bottom: 30px; font-size: 15px; }
.divider { text-align: center; margin: 22px 0; color: #aaa; position: relative; font-size: 14px; }
.divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #eee; }
.divider::before { left: 0; } .divider::after { right: 0; }
.auth-footer { text-align: center; margin-top: 22px; font-size: 14px; color: var(--secondary); }
.auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
.auth-footer a:hover { text-decoration: underline; }
.show-pass { position: relative; }
.show-pass input { padding-right: 45px; }
.show-pass button { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; color: #888; }
.demo-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">
            <a href="/">Shop<span>Ease</span></a>
        </div>

        <h2>Welcome Back! 👋</h2>
        <p class="subtitle">Login to your account to continue shopping</p>

        <div id="alert-box"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="show-pass">
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" onclick="togglePass()" title="Show/Hide password">👁️</button>
                </div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px">
                <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:#444">
                    <input type="checkbox" id="remember"> Remember me
                </label>
                <a href="#" style="font-size:14px;color:var(--primary);text-decoration:none">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn" style="font-size:16px;padding:14px">
                Login to ShopEase
            </button>
        </form>

        <div class="divider">or try demo accounts</div>

        <div class="demo-btns">
            <button class="btn btn-outline" onclick="demoLogin('user')">🧑 Demo User</button>
            <button class="btn btn-outline" onclick="demoLogin('admin')">👑 Demo Admin</button>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="/register">Create Account →</a>
        </div>

    </div>
</div>

<div id="toast" class="toast"></div>
<script src="/js/app.js"></script>
<script>
// Redirect if already logged in
if (Auth.isLoggedIn()) window.location.href = '/'

function togglePass() {
    const p = document.getElementById('password')
    p.type = p.type === 'password' ? 'text' : 'password'
}

async function handleLogin(e) {
    e.preventDefault()
    const btn = document.getElementById('login-btn')
    const alertBox = document.getElementById('alert-box')
    alertBox.innerHTML = ''
    btn.textContent = 'Logging in...'
    btn.disabled = true

    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value

    try {
        const data = await API.post('/auth/login', { email, password })
        if (data.token) {
            localStorage.setItem('user', JSON.stringify(data))
            showToast(`Welcome back, ${data.name}! 🎉`, 'success')
            setTimeout(() => window.location.href = data.role === 'admin' ? '/admin' : '/', 1200)
        } else {
            alertBox.innerHTML = `<div class="alert alert-danger">❌ ${data.message || 'Invalid email or password'}</div>`
            btn.textContent = 'Login to ShopEase'
            btn.disabled = false
        }
    } catch {
        alertBox.innerHTML = `<div class="alert alert-danger">❌ Server error. Please try again.</div>`
        btn.textContent = 'Login to ShopEase'
        btn.disabled = false
    }
}

function demoLogin(role) {
    document.getElementById('email').value = role === 'admin' ? 'admin@shopease.com' : 'user@shopease.com'
    document.getElementById('password').value = 'password123'
    showToast(`Demo ${role} credentials filled! Click Login.`, 'success')
}
</script>
</body>
</html>
