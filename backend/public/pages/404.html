<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase | 404 Not Found</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.not-found { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; }
.not-found-inner { max-width: 500px; }
.not-found h1 { font-size: 120px; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 10px; }
.not-found h2 { font-size: 28px; margin-bottom: 15px; }
.not-found p { color: var(--secondary); font-size: 16px; margin-bottom: 35px; line-height: 1.7; }
.not-found-btns { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
<nav>
    <a href="/" class="logo">Shop<span>Ease</span></a>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/shop">Shop</a></li>
        <li><a href="/contact">Contact</a></li>
    </ul>
</nav>
</header>

<div class="not-found">
    <div class="not-found-inner">
        <div style="font-size:80px;margin-bottom:20px">🔍</div>
        <h1>404</h1>
        <h2>Page Not Found!</h2>
        <p>Oops! The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
        <div class="not-found-btns">
            <a href="/" class="btn btn-primary">🏠 Go Home</a>
            <a href="/shop" class="btn btn-outline">🛍️ Browse Shop</a>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
