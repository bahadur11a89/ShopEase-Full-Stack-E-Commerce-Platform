<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase | Register</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0d6efd 0%, #084298 100%); padding: 40px 20px; }
.auth-card { background: #fff; border-radius: 16px; padding: 45px 40px; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.auth-logo { text-align: center; margin-bottom: 30px; }
.auth-logo a { font-size: 32px; font-weight: 800; color: var(--primary); text-decoration: none; }
.auth-logo a span { color: #ffc107; }
.auth-card h2 { font-size: 26px; text-align: center; margin-bottom: 8px; color: #212529; }
.auth-card .subtitle { text-align: center; color: var(--secondary); margin-bottom: 30px; font-size: 15px; }
.auth-footer { text-align: center; margin-top: 22px; font-size: 14px; color: var(--secondary); }
.auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
.auth-footer a:hover { text-decoration: underline; }
.strength-bar { height: 5px; border-radius: 3px; margin-top: 6px; background: #eee; transition: .3s; }
.strength-fill { height: 100%; border-radius: 3px; width: 0; transition: .3s; }
.show-pass { position: relative; }
.show-pass input { padding-right: 45px; }
.show-pass button { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; color: #888; }
.benefits { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
.benefit { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
</style>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">
            <a href="/">Shop<span>Ease</span></a>
        </div>

        <h2>Create Account 🚀</h2>
        <p class="subtitle">Join millions of happy shoppers today</p>

        <div class="benefits">
            <div class="benefit">✅ Free Delivery</div>
            <div class="benefit">🔒 Secure Payments</div>
            <div class="benefit">🔄 Easy Returns</div>
            <div class="benefit">🏷️ Exclusive Deals</div>
        </div>

        <div id="alert-box"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required minlength="3" autocomplete="name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="show-pass">
                    <input type="password" id="password" placeholder="Create a strong password (min 6 chars)" required minlength="6" oninput="checkStrength(this.value)" autocomplete="new-password">
                    <button type="button" onclick="togglePass('password')" title="Show/Hide">👁️</button>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                <small id="strength-text" style="color:#888;font-size:12px"></small>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="show-pass">
                    <input type="password" id="confirm-password" placeholder="Re-enter your password" required autocomplete="new-password">
                    <button type="button" onclick="togglePass('confirm-password')" title="Show/Hide">👁️</button>
                </div>
            </div>
            <div style="margin-bottom:22px">
                <label style="display:flex;align-items:flex-start;gap:10px;font-size:14px;cursor:pointer;color:#444">
                    <input type="checkbox" id="terms" required style="margin-top:3px;width:16px;height:16px;accent-color:var(--primary)">
                    I agree to the <a href="#" style="color:var(--primary)">Terms & Conditions</a> and <a href="#" style="color:var(--primary)">Privacy Policy</a>
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="reg-btn" style="font-size:16px;padding:14px">
                Create My Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login">Login →</a>
        </div>

    </div>
</div>

<div id="toast" class="toast"></div>
<script src="/js/app.js"></script>
<script>
// Redirect if already logged in
if (Auth.isLoggedIn()) window.location.href = '/'

function togglePass(id) {
    const p = document.getElementById(id)
    p.type = p.type === 'password' ? 'text' : 'password'
}

function checkStrength(val) {
    const fill = document.getElementById('strength-fill')
    const text = document.getElementById('strength-text')
    if (!val) { fill.style.width = '0'; text.textContent = ''; return; }
    if (val.length < 6) {
        fill.style.width = '25%'; fill.style.background = '#dc3545'; text.textContent = '⚠️ Weak password'
    } else if (val.length < 10 || !/[A-Z]/.test(val) || !/[0-9]/.test(val)) {
        fill.style.width = '60%'; fill.style.background = '#ffc107'; text.textContent = '👍 Medium strength'
    } else {
        fill.style.width = '100%'; fill.style.background = '#198754'; text.textContent = '✅ Strong password'
    }
}

async function handleRegister(e) {
    e.preventDefault()
    const alertBox = document.getElementById('alert-box')
    alertBox.innerHTML = ''

    const name = document.getElementById('name').value.trim()
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const confirm = document.getElementById('confirm-password').value

    if (password !== confirm) {
        alertBox.innerHTML = `<div class="alert alert-danger">❌ Passwords do not match!</div>`
        return
    }

    const btn = document.getElementById('reg-btn')
    btn.textContent = 'Creating account...'
    btn.disabled = true

    try {
        const data = await API.post('/auth/register', { name, email, password })
        if (data.token) {
            localStorage.setItem('user', JSON.stringify(data))
            showToast(`Welcome to ShopEase, ${data.name}! 🎉`, 'success')
            setTimeout(() => window.location.href = '/', 1500)
        } else {
            alertBox.innerHTML = `<div class="alert alert-danger">❌ ${data.message || 'Registration failed. Try again.'}</div>`
            btn.textContent = 'Create My Account'
            btn.disabled = false
        }
    } catch {
        alertBox.innerHTML = `<div class="alert alert-danger">❌ Server error. Please try again.</div>`
        btn.textContent = 'Create My Account'
        btn.disabled = false
    }
}
</script>
</body>
</html>
